<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="3132693.ico">
    <meta charset="UTF-8">
    <title>Dough Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>
    Dough Calculator
</h1>

<div class="main-container">

    <!-- LEFT COLUMN -->
    <div class="left-column">

        <!-- Hydration -->
        <div class="ball-section">
            <div class="input-group">
                <label for="hydration">Hydration (%)</label>
                <input type="number" id="hydration">
            </div>
        </div>

        <!-- Ball 1 with Fill button -->
        <div class="ball-section">
            <div class="input-group">
                <label for="flour1">Ball 1 Weight (g)</label>
                <input type="number" id="flour1">
            </div>
            <button class="fill-btn" onclick="fillWeights()">Fill</button>
        </div>

        <!-- Ball 2 -->
        <div class="ball-section">
            <div class="input-group">
                <label for="flour2">Ball 2 Weight (g)</label>
                <input type="number" id="flour2">
            </div>
        </div>

        <!-- Ball 3 -->
        <div class="ball-section">
            <div class="input-group">
                <label for="flour3">Ball 3 Weight (g)</label>
                <input type="number" id="flour3">
            </div>
        </div>

        <!-- Buttons -->
        <button onclick="calculateAll()">Calculate All</button>
        <button class="reset-btn" onclick="resetAll()">Reset</button>

    </div>

    <!-- Results Container -->
<div class="results-section">
    <div class="middle-column">
        <div class="results-box" id="totalResults"></div>
        <div class="percent-box" id="percentResults"></div>
    </div>

    <div class="right-column">
        <div class="steps-box" id="stepsBox"></div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
