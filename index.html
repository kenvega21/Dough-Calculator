<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="3132693.ico">
    <meta charset="UTF-8">
    <title>Dough Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Dough Calculator</h1>

<div class="main-container">

    <!-- LEFT COLUMN -->
    <div class="left-column">

        <!-- Batch Toggle -->
        <div class="ball-section">
            <div class="input-group">
                <label for="batchCount">Dough Balls</label>
                <select id="batchCount" onchange="updateBatchVisibility()">
                    <option value="1" selected>1 Ball</option>
                    <option value="3">3 Balls</option>
                </select>
            </div>
        </div>

        <div class="ball-section">
            <div class="input-group">
                <label for="hydration">Hydration (%)</label>
                <input type="number" id="hydration">
            </div>
        </div>

        <div class="ball-section" id="ball1Box">
            <div class="input-group">
                <label for="flour1">Ball 1 Weight (g)</label>
                <input type="number" id="flour1">
            </div>

            <!-- Fill button now has an ID -->
            <button id="fillBtn" class="fill-btn" onclick="fillWeights()">Fill</button>
        </div>

        <div class="ball-section" id="ball2Box">
            <div class="input-group">
                <label for="flour2">Ball 2 Weight (g)</label>
                <input type="number" id="flour2">
            </div>
        </div>

        <div class="ball-section" id="ball3Box">
            <div class="input-group">
                <label for="flour3">Ball 3 Weight (g)</label>
                <input type="number" id="flour3">
            </div>
        </div>

        <!-- Calculate button ALWAYS visible -->
        <button id="calculateBtn" onclick="calculateAll()">Calculate</button>

        <button class="reset-btn" onclick="resetAll()">Reset</button>

    </div>

    <!-- MIDDLE COLUMN -->
    <div class="middle-column">
        <div class="results-box" id="totalResults"></div>
        <div class="percent-box" id="percentResults"></div>
    </div>

    <!-- RIGHT COLUMN -->
    <div class="right-column">
        <div class="steps-box" id="stepsBox"></div>
        <!-- Fullscreen Steps Modal -->
<div id="stepsModal" class="steps-modal">
    <div class="steps-modal-content">
        <span id="closeSteps" class="close-btn">&times;</span>
        <div id="stepsModalText"></div>
    </div>
</div>


</div>

<script src="script.js"></script>

</body>
</html>
